---
Organizations:
  - &OrdererOrg
    Name: OrdererOrg
    ID: OrdererMSP
    MSPDir: crypto-config/ordererOrganizations/threattrust.local/msp
    Policies:
      Readers:
        Type: Signature
        Rule: "OR('OrdererMSP.member')"
      Writers:
        Type: Signature
        Rule: "OR('OrdererMSP.member')"
      Admins:
        Type: Signature
        Rule: "OR('OrdererMSP.admin')"

  - &BankA
    Name: BankAMSP
    ID: BankAMSP
    MSPDir: crypto-config/peerOrganizations/banka.threattrust.local/msp
    Policies:
      Readers:
        Type: Signature
        Rule: "OR('BankAMSP.admin', 'BankAMSP.peer', 'BankAMSP.client')"
      Writers:
        Type: Signature
        Rule: "OR('BankAMSP.admin', 'BankAMSP.client')"
      Admins:
        Type: Signature
        Rule: "OR('BankAMSP.admin')"
      Endorsement:
        Type: Signature
        Rule: "OR('BankAMSP.peer')"
    AnchorPeers:
      - Host: peer0.banka.threattrust.local
        Port: 7051

  - &BankB
    Name: BankBMSP
    ID: BankBMSP
    MSPDir: crypto-config/peerOrganizations/bankb.threattrust.local/msp
    Policies:
      Readers:
        Type: Signature
        Rule: "OR('BankBMSP.admin', 'BankBMSP.peer', 'BankBMSP.client')"
      Writers:
        Type: Signature
        Rule: "OR('BankBMSP.admin', 'BankBMSP.client')"
      Admins:
        Type: Signature
        Rule: "OR('BankBMSP.admin')"
      Endorsement:
        Type: Signature
        Rule: "OR('BankBMSP.peer')"
    AnchorPeers:
      - Host: peer0.bankb.threattrust.local
        Port: 8051

  - &CERTC
    Name: CERTCMSP
    ID: CERTCMSP
    MSPDir: crypto-config/peerOrganizations/certc.threattrust.local/msp
    Policies:
      Readers:
        Type: Signature
        Rule: "OR('CERTCMSP.admin', 'CERTCMSP.peer', 'CERTCMSP.client')"
      Writers:
        Type: Signature
        Rule: "OR('CERTCMSP.admin', 'CERTCMSP.client')"
      Admins:
        Type: Signature
        Rule: "OR('CERTCMSP.admin')"
      Endorsement:
        Type: Signature
        Rule: "OR('CERTCMSP.peer')"
    AnchorPeers:
      - Host: peer0.certc.threattrust.local
        Port: 9051

Capabilities:
  Channel: &ChannelCapabilities
    V2_0: true
  Orderer: &OrdererCapabilities
    V2_0: true
  Application: &ApplicationCapabilities
    V2_5: true

Application: &ApplicationDefaults
  Organizations:
  Policies:
    LifecycleEndorsement:
      Type: ImplicitMeta
      Rule: "MAJORITY Endorsement"
    Endorsement:
      Type: ImplicitMeta
      Rule: "MAJORITY Endorsement"
    Readers:
      Type: ImplicitMeta
      Rule: "ANY Readers"
    Writers:
      Type: ImplicitMeta
      Rule: "ANY Writers"
    Admins:
      Type: ImplicitMeta
      Rule: "MAJORITY Admins"
  Capabilities:
    <<: *ApplicationCapabilities

Orderer: &OrdererDefaults
  OrdererType: etcdraft
  Addresses:
    - orderer.threattrust.local:7050
  EtcdRaft:
    Consenters:
      - Host: orderer.threattrust.local
        Port: 7050
        ClientTLSCert: crypto-config/ordererOrganizations/threattrust.local/orderers/orderer.threattrust.local/tls/server.crt
        ServerTLSCert: crypto-config/ordererOrganizations/threattrust.local/orderers/orderer.threattrust.local/tls/server.crt
  BatchTimeout: 1s
  BatchSize:
    MaxMessageCount: 50
    AbsoluteMaxBytes: 10 MB
    PreferredMaxBytes: 2 MB
  Organizations:
  Policies:
    Readers:
      Type: ImplicitMeta
      Rule: "ANY Readers"
    Writers:
      Type: ImplicitMeta
      Rule: "ANY Writers"
    Admins:
      Type: ImplicitMeta
      Rule: "MAJORITY Admins"
    BlockValidation:
      Type: ImplicitMeta
      Rule: "ANY Writers"
  Capabilities:
    <<: *OrdererCapabilities

Channel: &ChannelDefaults
  Policies:
    Readers:
      Type: ImplicitMeta
      Rule: "ANY Readers"
    Writers:
      Type: ImplicitMeta
      Rule: "ANY Writers"
    Admins:
      Type: ImplicitMeta
      Rule: "MAJORITY Admins"
  Capabilities:
    <<: *ChannelCapabilities

Profiles:
  ThreeOrgsOrdererGenesis:
    <<: *ChannelDefaults
    Orderer:
      <<: *OrdererDefaults
      Organizations:
        - *OrdererOrg
      Capabilities: *OrdererCapabilities
    Consortiums:
      ThreatTrustConsortium:
        Organizations:
          - *BankA
          - *BankB
          - *CERTC

  ThreatTrustChannel:
    Consortium: ThreatTrustConsortium
    <<: *ChannelDefaults
    Application:
      <<: *ApplicationDefaults
      Organizations:
        - *BankA
        - *BankB
        - *CERTC
      Capabilities: *ApplicationCapabilities
