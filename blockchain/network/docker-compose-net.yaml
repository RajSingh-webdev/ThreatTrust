version: '3.7'

networks:
  threattrust_net:
    name: threattrust_net

services:
  orderer.threattrust.local:
    container_name: orderer.threattrust.local
    image: hyperledger/fabric-orderer:2.5
    environment:
      - FABRIC_LOGGING_SPEC=INFO
      - ORDERER_GENERAL_LISTENADDRESS=0.0.0.0
      - ORDERER_GENERAL_LISTENPORT=7050
      - ORDERER_GENERAL_GENESISMETHOD=file
      - ORDERER_GENERAL_GENESISFILE=/var/hyperledger/orderer/orderer.genesis.block
      - ORDERER_GENERAL_LOCALMSPID=OrdererMSP
      - ORDERER_GENERAL_LOCALMSPDIR=/var/hyperledger/orderer/msp
      - ORDERER_GENERAL_TLS_ENABLED=true
      - ORDERER_GENERAL_TLS_PRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_GENERAL_TLS_CERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_GENERAL_TLS_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_GENERAL_CLUSTER_CLIENTCERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_GENERAL_CLUSTER_CLIENTPRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_GENERAL_CLUSTER_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
    working_dir: /opt/gopath/src/github.com/hyperledger/fabric
    command: orderer
    volumes:
      - ./channel-artifacts/genesis.block:/var/hyperledger/orderer/orderer.genesis.block
      - ./crypto-config/ordererOrganizations/threattrust.local/orderers/orderer.threattrust.local/msp:/var/hyperledger/orderer/msp
      - ./crypto-config/ordererOrganizations/threattrust.local/orderers/orderer.threattrust.local/tls/:/var/hyperledger/orderer/tls
    ports:
      - 7050:7050
    networks:
      - threattrust_net

  peer0.banka.threattrust.local:
    container_name: peer0.banka.threattrust.local
    image: hyperledger/fabric-peer:2.5
    environment:
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=threattrust_net
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_PROFILE_ENABLED=false
      - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/fabric/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
      - CORE_PEER_ID=peer0.banka.threattrust.local
      - CORE_PEER_ADDRESS=peer0.banka.threattrust.local:7051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:7051
      - CORE_PEER_CHAINCODEADDRESS=peer0.banka.threattrust.local:7052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:7052
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.banka.threattrust.local:7051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.banka.threattrust.local:7051
      - CORE_PEER_LOCALMSPID=BankAMSP
    working_dir: /opt/gopath/src/github.com/hyperledger/fabric/peer
    command: peer node start
    volumes:
      - /var/run/:/host/var/run/
      - ./crypto-config/peerOrganizations/banka.threattrust.local/peers/peer0.banka.threattrust.local/msp:/etc/hyperledger/fabric/msp
      - ./crypto-config/peerOrganizations/banka.threattrust.local/peers/peer0.banka.threattrust.local/tls:/etc/hyperledger/fabric/tls
    ports:
      - 7051:7051
    networks:
      - threattrust_net

  peer0.bankb.threattrust.local:
    container_name: peer0.bankb.threattrust.local
    image: hyperledger/fabric-peer:2.5
    environment:
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=threattrust_net
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_PROFILE_ENABLED=false
      - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/fabric/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
      - CORE_PEER_ID=peer0.bankb.threattrust.local
      - CORE_PEER_ADDRESS=peer0.bankb.threattrust.local:8051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:8051
      - CORE_PEER_CHAINCODEADDRESS=peer0.bankb.threattrust.local:8052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:8052
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.bankb.threattrust.local:8051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.bankb.threattrust.local:8051
      - CORE_PEER_LOCALMSPID=BankBMSP
    working_dir: /opt/gopath/src/github.com/hyperledger/fabric/peer
    command: peer node start
    volumes:
      - /var/run/:/host/var/run/
      - ./crypto-config/peerOrganizations/bankb.threattrust.local/peers/peer0.bankb.threattrust.local/msp:/etc/hyperledger/fabric/msp
      - ./crypto-config/peerOrganizations/bankb.threattrust.local/peers/peer0.bankb.threattrust.local/tls:/etc/hyperledger/fabric/tls
    ports:
      - 8051:8051
    networks:
      - threattrust_net

  peer0.certc.threattrust.local:
    container_name: peer0.certc.threattrust.local
    image: hyperledger/fabric-peer:2.5
    environment:
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=threattrust_net
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_PROFILE_ENABLED=false
      - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/fabric/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
      - CORE_PEER_ID=peer0.certc.threattrust.local
      - CORE_PEER_ADDRESS=peer0.certc.threattrust.local:9051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:9051
      - CORE_PEER_CHAINCODEADDRESS=peer0.certc.threattrust.local:9052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:9052
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.certc.threattrust.local:9051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.certc.threattrust.local:9051
      - CORE_PEER_LOCALMSPID=CERTCMSP
    working_dir: /opt/gopath/src/github.com/hyperledger/fabric/peer
    command: peer node start
    volumes:
      - /var/run/:/host/var/run/
      - ./crypto-config/peerOrganizations/certc.threattrust.local/peers/peer0.certc.threattrust.local/msp:/etc/hyperledger/fabric/msp
      - ./crypto-config/peerOrganizations/certc.threattrust.local/peers/peer0.certc.threattrust.local/tls:/etc/hyperledger/fabric/tls
    ports:
      - 9051:9051
    networks:
      - threattrust_net

  cli:
    container_name: cli
    image: hyperledger/fabric-tools:2.5
    tty: true
    stdin_open: true
    environment:
      - GOPATH=/opt/gopath
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_PEER_ID=cli
      - CORE_PEER_ADDRESS=peer0.banka.threattrust.local:7051
      - CORE_PEER_LOCALMSPID=BankAMSP
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_TLS_CERT_FILE=/opt/gopath/src/github.com/hyperledger/fabric/peer/crypto/peerOrganizations/banka.threattrust.local/peers/peer0.banka.threattrust.local/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/opt/gopath/src/github.com/hyperledger/fabric/peer/crypto/peerOrganizations/banka.threattrust.local/peers/peer0.banka.threattrust.local/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/opt/gopath/src/github.com/hyperledger/fabric/peer/crypto/peerOrganizations/banka.threattrust.local/peers/peer0.banka.threattrust.local/tls/ca.crt
      - CORE_PEER_MSPCONFIGPATH=/opt/gopath/src/github.com/hyperledger/fabric/peer/crypto/peerOrganizations/banka.threattrust.local/users/Admin@banka.threattrust.local/msp
    working_dir: /opt/gopath/src/github.com/hyperledger/fabric/peer
    volumes:
      - /var/run/:/host/var/run/
      - ./crypto-config:/opt/gopath/src/github.com/hyperledger/fabric/peer/crypto/
      - ./channel-artifacts:/opt/gopath/src/github.com/hyperledger/fabric/peer/channel-artifacts/
      - ../chaincode:/opt/gopath/src/github.com/hyperledger/fabric/peer/chaincode/
    depends_on:
      - orderer.threattrust.local
      - peer0.banka.threattrust.local
      - peer0.bankb.threattrust.local
      - peer0.certc.threattrust.local
    networks:
      - threattrust_net
